name: Release

on:
  workflow_call:
    secrets:
      signing-key:
        description: 'Passphrase-less SSH private key used to sign the release commit'
        required: true
      git-token:
        description: 'Token with write access. Must not be the default GITHUB_TOKEN, or the release it creates will not trigger downstream workflows.'
        required: true

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Runs before checkout so the --global config is in place for every later git call.
      - name: Configure git
        run: |
          mkdir -p ~/.ssh
          echo "$SIGNING_KEY" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/.ssh/signing_key"
          git config --global commit.gpgsign true
          git config --global user.name "Mendabot"
          git config --global user.email mendabot@pm.me
        env:
          SIGNING_KEY: ${{ secrets.signing-key }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.git-token }}
          # semantic-release reads the full history and tags to pick the next version.
          fetch-depth: 0

      # Inlined rather than `uses: ./setup`, because a relative action path inside a
      # reusable workflow resolves against the caller's checkout, not this repository.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          scope: '@mendabot'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Make new version
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.git-token }}
          GIT_AUTHOR_NAME: Mendabot
          GIT_AUTHOR_EMAIL: mendabot@pm.me
          GIT_COMMITTER_NAME: Mendabot
          GIT_COMMITTER_EMAIL: mendabot@pm.me
