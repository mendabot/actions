name: 'Setup'
description: 'Set up pnpm and Node.js, then install dependencies from the lockfile'

inputs:
  install:
    description: 'Whether to run pnpm install'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # Must precede setup-node: its pnpm cache resolves the store via `pnpm store path`.
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Setup node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'
        scope: '@mendabot'

    - name: Install deps
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
